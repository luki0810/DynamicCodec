# Auto-generated by bash.sh; safe to edit if you want combo-specific tweaks.
$include:
  - ../input/wav.yaml
  - ../model/encoder/dac.yaml
  - ../model/decoder/dac.yaml
  - ../model/quantizer/rvq.yaml

# component identity (consumed by model/build.py:build_model)
input_format: wav
encoder: dac
quantizer: rvq
decoder: dac
vocoder: null

# inference runtime
sample_rate: 48000
batch_size: 1
device: cuda:0
ssl_model.device: cuda:0
seed: 42
resume: true
exp_name: dac-result   # checkpoint dir name (relative to runs/)
tag: best              # which subdir of exp_name to load
