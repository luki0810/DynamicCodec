# Transforms
build_transform.augment_prob: 0.0
build_transform.preprocess:
  - Identity
build_transform.augment:
  - Identity
build_transform.postprocess:
  - VolumeNorm
  - RescaleAudio
  - ShiftPhase

VolumeNorm.db: [const, -16]

# dataset folder
# audiotools.AudioLoader treats a *.csv path as a manifest with a `path` column;
# any non-csv entry is treated as a folder and recursively scanned for audio.
# Manifests below are generated by scripts/build_vctk_manifest.py and contain
# absolute wav paths (so cwd is irrelevant when audiotools resolves them).
train/build_dataset.folders:
  VCTK:
    - data/manifests/vctk/train.csv

val/build_dataset.folders:
  VCTK:
    - data/manifests/vctk/val.csv

test/build_dataset.folders:
  VCTK:
    - data/manifests/vctk/test.csv


# Data
train/AudioDataset.duration: 0.1
train/AudioDataset.n_examples: 10000000

val/AudioDataset.duration: 0.5
val/build_transform.augment_prob: 1.0
val/AudioDataset.n_examples: 4

test/AudioDataset.duration: 1.0
test/build_transform.augment_prob: 1.0
test/AudioDataset.n_examples: 4

AudioLoader.shuffle: true
AudioDataset.without_replacement: true
